plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
	id 'me.shedaniel.unified-publishing' version '0.1.+'
}

apply from: '../common.gradle'

dependencies {
	//to change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	runtimeOnly "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// javax.annotation.Nullable
	implementation 'com.google.code.findbugs:jsr305:3.0.1'
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25

	withSourcesJar()
}

base {
	archivesName = project.archives_base_name
}
version = project.mod_version
group = project.dev_group

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand project.mergedProperties
	}
}

// configure  the source folders
sourceSets {
	main {
		java {
			// Minecraft 26.x is unobfuscated and its API differs a lot from the 1.21 era.
			// The 26.2-adapted classes therefore live in this loader directory only,
			// while ../src/main/java (1.21.x era) stays untouched for the Forge/NeoForge builds.
			srcDirs = ['src/main/java']
		}
		resources {
			srcDir '../src/main/resources'
			exclude '.cache'
			exclude 'Thumbs.db'
		}
	}
}

// ensure that the encoding is set to UTF-8, no matter what the system default is
// this fixes some edge cases with special characters not displaying correctly
// see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
tasks.withType(JavaCompile).configureEach {
	options.encoding = "UTF-8"

	// Minecraft 26.1 and upwards uses Java 25.
	it.options.release = 25
}

jar {
	from "LICENSE"

	manifest {
		attributes('Implementation-Timestamp': new Date().toString())
	}

	// Keep the "-fabric" suffix that remapJar used to add to the artifact name
	archiveClassifier = 'fabric'
}

publishUnified.dependsOn mergeChangelog
publishUnified.inputs.files(mergeChangelog.outputs)
publishUnified.mustRunAfter(mergeChangelog)

unifiedPublishing {
	project {
		displayName = "${project.archives_base_name}-${project.mod_version}-fabric"
		version = "${project.mod_version}"
		changelog.set(project.changelogProvider)
		releaseType = "release" // Use "release", "beta" or "alpha"
		gameVersions = project.enumeratedMcVersions
		gameLoaders = ["fabric"]

		mainPublication tasks.jar // Declares the publicated jar

		relations {
			depends { // Mark as a required dependency
				curseforge = "fabric-api"
				modrinth = "fabric-api"
			}
		}

		if (project.curseforgeApiToken != null) {
			curseforge {
				token = project.curseforgeApiToken
				id = "387365"
			}
		}

		if (project.modrinthApiToken != null) {
			modrinth {
				token = project.modrinthApiToken
				id = "P7dR8mSH" // Required, must be a string, ID of Modrinth project
			}
		}
	}
}
